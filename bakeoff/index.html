<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bake-offs &middot; Turing Circle</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="bakeoff.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../favicon.png">
</head>
<body>

<header class="site-title">
  <h1>Bake-offs</h1>
</header>

<div class="tool">
  <div id="list"><p class="status">Loading&hellip;</p></div>
</div>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Each bake-off's current standings, shown here so you can see where things
// stand before clicking in. Never cached: the board changes on every
// submission, and Pages serves with max-age=600.
async function board(slug) {
  let d;
  try {
    d = await fetch(slug + "/leaderboard.json?t=" + Date.now(),
                    { cache: "no-store" }).then(r => r.json());
  } catch (e) { return ""; }

  // "metric" in leaderboard.json: "mse" (default, lower is better) or "r2".
  const r2 = d.metric === "r2", label = r2 ? "Test R\u00b2" : "Test MSE";
  const fmt = v => r2 ? (Math.abs(v) < 5e-4 ? 0 : Number(v)).toFixed(3) : Number(v).toPrecision(4);
  const score = e => e.test_score ?? e.test_mse, bscore = b => b.score ?? b.mse;
  const beats = (a, b) => r2 ? a > b : a < b;
  const rows = (d.entries || []).slice().sort((a, b) => r2 ? score(b) - score(a) : score(a) - score(b));
  const base = d.baseline;
  if (!rows.length) {
    return `<div class="k">Leaderboard</div><p class="empty">Nothing submitted yet.` +
           (base ? ` The number to beat is <strong>${fmt(bscore(base))}</strong> (${label.replace("Test ", "")}).` : "") +
           `</p>`;
  }

  const top = rows.slice(0, 5);
  let out = "", rank = 0, placed = false;
  const line = (name, v, isBase) =>
    `<tr class="${isBase ? "baseline" : ""}"><td>${isBase ? "&mdash;" : ++rank}</td>` +
    `<td>${esc(name)}</td><td class="num">${fmt(v)}</td></tr>`;
  for (const e of top) {
    if (!placed && base && beats(bscore(base), score(e))) {
      out += line(base.label || "baseline", bscore(base), true); placed = true;
    }
    out += line(e.name, score(e), false);
  }
  if (!placed && base) out += line(base.label || "baseline", bscore(base), true);

  const more = rows.length - top.length;
  return `<div class="k">Leaderboard</div>` +
    `<table><thead><tr><th>#</th><th>Name</th><th class="num">${label}</th></tr></thead>` +
    `<tbody>${out}</tbody></table>` +
    (more > 0 ? `<p class="empty">and ${more} more</p>` : "");
}

fetch("bakeoffs.json").then(r => r.json()).then(async d => {
  const list = d.bakeoffs || [];
  if (!list.length) {
    document.getElementById("list").innerHTML = "<p class='hint'>None open just yet.</p>";
    return;
  }
  const boards = await Promise.all(list.map(b => board(b.slug)));
  document.getElementById("list").innerHTML = list.map((b, i) => `
    <div class="step">
      <div class="bo">
        <div class="bo-main">
          <h3><span class="num">${i + 1}</span>${b.status === "open"
            ? `<a href="${esc(b.slug)}/">${esc(b.title)}</a>`
            : esc(b.title) + " <em>(closed)</em>"}</h3>
          <p class="hint">${esc(b.problem_set || "")}</p>
          <p>${esc(b.blurb || "")}</p>
        </div>
        <div class="bo-board">${boards[i]}</div>
      </div>
    </div>`).join("");
}).catch(e => {
  document.getElementById("list").innerHTML =
    "<p class='error'>Could not load the list: " + e + "</p>";
});
</script>

</body>
</html>
