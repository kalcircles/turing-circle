name: Bake-off submission
description: Submit a model to a Turing Circle bake-off leaderboard
title: "Bake-off submission"
labels: ["bakeoff"]
body:
  - type: markdown
    attributes:
      value: |
        The bake-off page fills this in for you. Check it looks right and press
        **Create**. The leaderboard updates on its own a minute or so later.
  - type: input
    id: name
    attributes:
      label: Name
      description: As you want it to appear on the leaderboard.
    validations:
      required: true
  - type: input
    id: bakeoff
    attributes:
      label: Bake-off
      description: The folder name, e.g. heat-capacity. Leave as filled in.
    validations:
      required: true
  - type: input
    id: test-score
    attributes:
      label: Test score
      description: MSE or R², whichever the bake-off uses.
    validations:
      required: true
  - type: input
    id: train-score
    attributes:
      label: Train score
    validations:
      required: false
  - type: textarea
    id: code
    attributes:
      label: Code
      render: python
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Uploaded files (weights and so on), filled in by the page. Leave as it is.
      render: json
    validations:
      required: false
